<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="dlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="dlCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dlBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#0ea5e9">// AI 翻译</text>

  <!-- 左：原文 -->
  <g transform="translate(80 132)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="440" height="250" rx="16" fill="#111a28" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="0" y="0" width="440" height="46" rx="16" fill="#16223400"/>
    <text x="24" y="30" font-size="15" font-weight="700" fill="#5f7c99">中文 · 原文</text>
    <line x1="0" y1="46" x2="440" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-size="21" font-weight="700" fill="#cbd8e6">
      <text x="24" y="92">随函附上本季度报告，</text>
      <text x="24" y="130">烦请查收并于本周内</text>
      <text x="24" y="168">回复确认。</text>
    </g>
    <rect x="24" y="196" width="150" height="32" rx="8" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-opacity="0.45"/>
    <text x="42" y="218" font-size="14" font-weight="700" fill="#5fc4ee">语气：正式</text>
  </g>

  <!-- 中：箭头 -->
  <g stroke="#22d3ee" stroke-opacity="0.8" stroke-width="4" fill="none">
    <path d="M544 250 H 616"/><path d="M606 240 L 624 250 L 606 260 Z" fill="#22d3ee" stroke="none"/>
  </g>
  <text x="584" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#5fd0e0" text-anchor="middle">DeepL</text>

  <!-- 右：译文 -->
  <g transform="translate(648 132)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="472" height="250" rx="16" fill="#111a28" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="24" y="30" font-size="15" font-weight="700" fill="#5f7c99">English · 译文</text>
    <line x1="0" y1="46" x2="472" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-size="20" font-weight="700" fill="#d6e4f0">
      <text x="24" y="92">Please find the quarterly</text>
      <text x="24" y="130">report enclosed, and kindly</text>
      <text x="24" y="168">confirm receipt this week.</text>
    </g>
    <text x="24" y="218" font-size="15" font-weight="700" fill="#4ade80">✓ 语序自然 · 敬语得体</text>
  </g>

  <!-- 下：Pro 三个卖点 -->
  <g transform="translate(80 414)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">
    <rect x="0" y="0" width="336" height="62" rx="14" fill="rgba(14,165,233,0.08)" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="24" y="38" font-size="22">📄</text>
    <text x="60" y="37" fill="#a9c6dc">文档翻译 · 译文可编辑</text>

    <rect x="352" y="0" width="336" height="62" rx="14" fill="rgba(14,165,233,0.08)" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="376" y="38" font-size="22">📕</text>
    <text x="412" y="37" fill="#a9c6dc">术语库统一译法</text>

    <rect x="704" y="0" width="336" height="62" rx="14" fill="rgba(14,165,233,0.08)" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="728" y="38" font-size="22">🔒</text>
    <text x="764" y="37" fill="#a9c6dc">译后即删 · 不留存</text>
  </g>

  <text x="80" y="590" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#dlCap)">DeepL Pro</text>
  <text x="380" y="590" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#6f8ba3">翻译质量 · 各档价格 · 国内订阅</text>
</svg>
