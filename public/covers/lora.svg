<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="lrBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <linearGradient id="lrCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#lrBg)"/>
  <text x="80" y="84" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#c084fc">// AI 原理</text>

  <!-- 左：冻结的底座大模型 -->
  <g transform="translate(80 150)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="300" height="310" rx="18" fill="rgba(148,163,184,0.07)" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2"/>
    <text x="150" y="56" font-size="40">🧊</text>
    <text x="150" y="100" font-size="25" font-weight="800" fill="#cbd5e1">底座大模型</text>
    <text x="150" y="130" font-size="17" font-weight="700" fill="#7d8ba0">冻结 · 一个参数都不动</text>
    <g fill="#94a3b8" opacity="0.45">
      <circle cx="66" cy="182" r="7"/><circle cx="108" cy="172" r="7"/><circle cx="150" cy="186" r="7"/><circle cx="192" cy="172" r="7"/><circle cx="234" cy="182" r="7"/>
      <circle cx="66" cy="222" r="7"/><circle cx="108" cy="212" r="7"/><circle cx="150" cy="226" r="7"/><circle cx="192" cy="212" r="7"/><circle cx="234" cy="222" r="7"/>
      <circle cx="66" cy="262" r="7"/><circle cx="108" cy="252" r="7"/><circle cx="150" cy="266" r="7"/><circle cx="192" cy="252" r="7"/><circle cx="234" cy="262" r="7"/>
    </g>
    <text x="150" y="296" font-size="16" font-weight="700" fill="#64748b">数十 GB · 共享不变</text>
  </g>

  <!-- 中：加号 -->
  <text x="416" y="318" font-family="Inter, sans-serif" font-size="46" font-weight="800" fill="#4b5563" text-anchor="middle">+</text>

  <!-- 中右：LoRA 小补丁 -->
  <g transform="translate(462 178)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="330" height="254" rx="16" fill="rgba(192,132,252,0.09)" stroke="#c084fc" stroke-opacity="0.55" stroke-width="2"/>
    <text x="165" y="42" font-size="23" font-weight="800" fill="#d8b4fe" text-anchor="middle">LoRA 小补丁</text>
    <text x="165" y="70" font-size="15" font-weight="700" fill="#9a7cb8" text-anchor="middle">只训练这两个瘦长矩阵</text>

    <!-- 两个低秩矩阵 -->
    <g>
      <rect x="46" y="94" width="34" height="104" rx="6" fill="#c084fc" opacity="0.8"/>
      <text x="63" y="216" font-size="14" font-weight="700" fill="#a78bbf" text-anchor="middle">A</text>
      <text x="106" y="152" font-size="22" font-weight="800" fill="#6b7280" text-anchor="middle">×</text>
      <rect x="130" y="128" width="154" height="34" rx="6" fill="#34d399" opacity="0.8"/>
      <text x="207" y="216" font-size="14" font-weight="700" fill="#5f9e86" text-anchor="middle">B</text>
    </g>
    <text x="165" y="242" font-size="16" font-weight="700" fill="#86efac" text-anchor="middle">几 MB ~ 几百 MB</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#34d399" stroke-opacity="0.75" stroke-width="4" fill="none">
    <path d="M816 306 H 872"/><path d="M862 296 L 878 306 L 862 316 Z" fill="#34d399" stroke="none"/>
  </g>

  <!-- 右：一个底座挂多个插件 -->
  <g transform="translate(898 196)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700">
    <text x="111" y="-8" font-size="15" fill="#5f9e86" text-anchor="middle">同一底座，随时换身份</text>
    <rect x="0" y="8" width="222" height="56" rx="12" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="22" y="42" font-size="20">🎨</text>
    <text x="56" y="41" fill="#a7dcc6">某种画风</text>

    <rect x="0" y="76" width="222" height="56" rx="12" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="22" y="110" font-size="20">⚖️</text>
    <text x="56" y="109" fill="#a7dcc6">法律文书语气</text>

    <rect x="0" y="144" width="222" height="56" rx="12" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="22" y="178" font-size="20">💬</text>
    <text x="56" y="177" fill="#a7dcc6">客服固定话术</text>
  </g>

  <text x="80" y="556" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="url(#lrCap)">LoRA</text>
  <text x="252" y="556" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="600" fill="#7c7a92">给大模型「外挂」一个小插件</text>
  <text x="80" y="598" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#5f5d72">冻结底座 · 只训练低秩小矩阵 · 消费级显卡也能微调</text>
</svg>
