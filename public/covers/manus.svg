<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="mnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <linearGradient id="mnCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#mnBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#818cf8">// AI 智能体</text>

  <!-- 左：任务目标 -->
  <g transform="translate(80 232)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="248" height="160" rx="16" fill="rgba(129,140,248,0.10)" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="24" y="42" font-size="15" font-weight="700" fill="#a5aef5">你的一句话目标</text>
    <rect x="24" y="58" width="200" height="80" rx="10" fill="rgba(129,140,248,0.06)"/>
    <text x="40" y="90" font-size="16" fill="#c7cbf5">「调研这三家</text>
    <text x="40" y="116" font-size="16" fill="#c7cbf5">公司并出报告」</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#34d399" stroke-opacity="0.7" stroke-width="4" fill="none">
    <path d="M340 312 H 398"/><path d="M388 302 L 404 312 L 388 322 Z" fill="#34d399" stroke="none"/>
  </g>
  <text x="370" y="294" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#5fb394" text-anchor="middle">自主执行</text>

  <!-- 中：Manus 自主执行的步骤流 -->
  <g transform="translate(430 130)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="430" height="416" rx="18" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-opacity="0.09"/>
    <!-- 头 -->
    <g transform="translate(24 24)">
      <rect x="0" y="0" width="46" height="40" rx="10" fill="#141b24" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="15" cy="20" r="5" fill="#34d399"/><circle cx="31" cy="20" r="5" fill="#34d399"/>
      <rect x="19" y="-10" width="8" height="10" fill="#34d399" opacity="0.7"/>
    </g>
    <text x="84" y="38" font-size="22" font-weight="800" fill="#e5e7eb">Manus 正在执行…</text>
    <circle cx="392" cy="30" r="6" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>

    <!-- 步骤链 -->
    <g font-size="17" font-weight="700">
      <!-- 步骤1 拆解 -->
      <circle cx="44" cy="104" r="16" fill="rgba(129,140,248,0.18)" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="44" y="110" font-size="16" fill="#a5aef5" text-anchor="middle">1</text>
      <rect x="72" y="84" width="320" height="42" rx="10" fill="rgba(129,140,248,0.06)"/>
      <text x="92" y="111" fill="#c7cbf5">🧩 拆解任务为多步计划</text>

      <!-- 步骤2 上网搜 -->
      <circle cx="44" cy="176" r="16" fill="rgba(96,165,250,0.18)" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="44" y="182" font-size="16" fill="#93c5fd" text-anchor="middle">2</text>
      <rect x="72" y="156" width="320" height="42" rx="10" fill="rgba(96,165,250,0.06)"/>
      <text x="92" y="183" fill="#bcd3f7">🔍 上网搜集三家资料</text>

      <!-- 步骤3 调工具 -->
      <circle cx="44" cy="248" r="16" fill="rgba(251,191,36,0.18)" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="44" y="254" font-size="16" fill="#fcd34d" text-anchor="middle">3</text>
      <rect x="72" y="228" width="320" height="42" rx="10" fill="rgba(251,191,36,0.06)"/>
      <text x="92" y="255" fill="#f5e0a8">🛠 调用工具整理成表</text>

      <!-- 步骤4 产出 -->
      <circle cx="44" cy="320" r="16" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-opacity="0.7"/>
      <text x="44" y="326" font-size="16" fill="#6ee7b7" text-anchor="middle">✓</text>
      <rect x="72" y="300" width="320" height="42" rx="10" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="92" y="327" fill="#a7f3d0">📄 交付调研报告</text>
    </g>
    <!-- 连接竖线 -->
    <g stroke="#3a4657" stroke-width="2" stroke-dasharray="4 5">
      <path d="M44 120 V 160"/><path d="M44 192 V 232"/><path d="M44 264 V 304"/>
    </g>
  </g>

  <text x="80" y="600" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#mnCap)">Manus</text>
  <text x="316" y="600" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#8791b0">能自己干活的 AI 智能体 · 国内订阅全流程</text>
</svg>
