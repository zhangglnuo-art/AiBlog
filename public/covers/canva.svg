<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset="1" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="cvCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cvBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#22d3ee">// AI 设计</text>

  <!-- 左：一句话输入 -->
  <g transform="translate(80 130)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="380" height="128" rx="16" fill="#121824" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="24" y="34" font-size="15" font-weight="700" fill="#5f8a99">输入 · 一句话需求</text>
    <text x="24" y="76" font-size="21" font-weight="700" fill="#cfe3ea">「做一张新品发布</text>
    <text x="24" y="106" font-size="21" font-weight="700" fill="#cfe3ea">的社媒海报」</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#a78bfa" stroke-opacity="0.8" stroke-width="4" fill="none">
    <path d="M484 194 H 540"/><path d="M530 184 L 548 194 L 530 204 Z" fill="#a78bfa" stroke="none"/>
  </g>
  <text x="516" y="176" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#b9a3f0" text-anchor="middle">Magic Design</text>

  <!-- 右：生成的三张稿 -->
  <g transform="translate(572 126)">
    <rect x="0" y="0" width="160" height="136" rx="12" fill="#1a2030" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="16" y="16" width="128" height="58" rx="6" fill="#22d3ee" opacity="0.35"/>
    <rect x="16" y="86" width="96" height="10" rx="5" fill="#5f7a8a"/>
    <rect x="16" y="104" width="70" height="10" rx="5" fill="#41525f"/>

    <rect x="180" y="0" width="160" height="136" rx="12" fill="#1a2030" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="260" cy="46" r="28" fill="#a78bfa" opacity="0.42"/>
    <rect x="196" y="86" width="112" height="10" rx="5" fill="#5f7a8a"/>
    <rect x="196" y="104" width="80" height="10" rx="5" fill="#41525f"/>

    <rect x="360" y="0" width="160" height="136" rx="12" fill="#1a2030" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="376" y="16" width="60" height="58" rx="6" fill="#f472b6" opacity="0.38"/>
    <rect x="444" y="16" width="60" height="58" rx="6" fill="#4ade80" opacity="0.32"/>
    <rect x="376" y="86" width="104" height="10" rx="5" fill="#5f7a8a"/>
    <rect x="376" y="104" width="72" height="10" rx="5" fill="#41525f"/>
  </g>

  <!-- Magic Switch：一稿多尺寸 -->
  <g transform="translate(80 306)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="0" y="20" font-size="19" font-weight="800" fill="#a78bfa">Magic Switch · 一稿多用</text>
    <text x="250" y="20" font-size="15" font-weight="600" fill="#63748a">同一份设计一键换尺寸、转格式、换语言</text>

    <g transform="translate(0 40)">
      <rect x="0" y="0" width="150" height="112" rx="10" fill="rgba(34,211,238,0.10)" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="75" y="52" font-size="15" font-weight="700" fill="#8fd3e4" text-anchor="middle">社媒方图</text>
      <text x="75" y="78" font-size="13" font-weight="600" fill="#5f8a99" text-anchor="middle">1:1</text>

      <rect x="172" y="0" width="216" height="112" rx="10" fill="rgba(167,139,250,0.10)" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="280" y="52" font-size="15" font-weight="700" fill="#c4b0f5" text-anchor="middle">公众号头图</text>
      <text x="280" y="78" font-size="13" font-weight="600" fill="#8272ad" text-anchor="middle">2.35:1</text>

      <rect x="410" y="0" width="180" height="112" rx="10" fill="rgba(74,222,128,0.09)" stroke="#4ade80" stroke-opacity="0.4"/>
      <text x="500" y="52" font-size="15" font-weight="700" fill="#9ce8b6" text-anchor="middle">PPT 封面</text>
      <text x="500" y="78" font-size="13" font-weight="600" fill="#5f9e79" text-anchor="middle">16:9</text>

      <rect x="612" y="0" width="180" height="112" rx="10" fill="rgba(244,114,182,0.09)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="702" y="52" font-size="15" font-weight="700" fill="#f7b3d4" text-anchor="middle">竖版故事</text>
      <text x="702" y="78" font-size="13" font-weight="600" fill="#a86088" text-anchor="middle">9:16</text>
    </g>
  </g>

  <text x="80" y="590" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#cvCap)">Canva Pro</text>
  <text x="382" y="590" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#6f8494">AI 设计功能 · 各档价格 · 国内订阅</text>
</svg>
