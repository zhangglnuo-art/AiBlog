<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#081016"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="fcCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#fcBg)"/>
  <text x="80" y="84" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#38bdf8">// AI 原理</text>

  <!-- 左：大模型（关在屋里，只会生成文字） -->
  <g transform="translate(80 150)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="330" height="300" rx="18" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <!-- 大脑图标 -->
    <g transform="translate(28 28)">
      <rect x="0" y="0" width="52" height="46" rx="12" fill="#0e1a26" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="17" cy="23" r="6" fill="#38bdf8"/><circle cx="35" cy="23" r="6" fill="#38bdf8"/>
      <rect x="22" y="-12" width="8" height="12" fill="#38bdf8" opacity="0.7"/>
    </g>
    <text x="96" y="42" font-size="24" font-weight="800" fill="#e5e7eb">大模型</text>
    <text x="96" y="68" font-size="15" font-weight="600" fill="#6b8299">聪明，但只会生成文字</text>

    <!-- 它"说出"要调的工具 -->
    <rect x="24" y="100" width="282" height="70" rx="12" fill="rgba(251,191,36,0.10)" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="40" y="130" font-size="14" font-weight="700" fill="#c99a3f">它不硬编，而是"说出"要调谁：</text>
    <text x="40" y="156" font-family="Consolas, monospace" font-size="19" font-weight="800" fill="#fcd34d">查天气(城市="北京")</text>

    <!-- 最终回复 -->
    <rect x="24" y="192" width="282" height="76" rx="12" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="40" y="220" font-size="14" font-weight="700" fill="#5fb394">拿到结果后，组织成人话：</text>
    <text x="40" y="250" font-size="18" font-weight="800" fill="#a7f3d0">「北京今天晴，26℃」</text>
  </g>

  <!-- 中间：调用 → / 结果回填 ← -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g stroke="#fbbf24" stroke-opacity="0.8" stroke-width="4" fill="none">
      <path d="M424 236 H 512"/><path d="M502 226 L 518 236 L 502 246 Z" fill="#fbbf24" stroke="none"/>
    </g>
    <text x="470" y="222" font-size="15" font-weight="700" fill="#e0b64f" text-anchor="middle">① 调用</text>

    <g stroke="#34d399" stroke-opacity="0.8" stroke-width="4" fill="none">
      <path d="M512 344 H 424"/><path d="M434 334 L 418 344 L 434 354 Z" fill="#34d399" stroke="none"/>
    </g>
    <text x="470" y="382" font-size="15" font-weight="700" fill="#5fb394" text-anchor="middle">③ 结果回填</text>
    <text x="470" y="332" font-family="Consolas, monospace" font-size="16" font-weight="800" fill="#6ee7b7" text-anchor="middle">晴 26℃</text>
  </g>

  <!-- 右：外部工具（由程序真正执行） -->
  <g transform="translate(534 138)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="380" height="324" rx="18" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="28" y="44" font-size="18" font-weight="700" fill="#9fb4c9">② 外部程序真正执行</text>

    <!-- 天气（高亮） -->
    <rect x="28" y="66" width="324" height="66" rx="12" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="52" y="106" font-size="28" text-anchor="middle">🌤</text>
    <text x="82" y="98" font-size="19" font-weight="800" fill="#7dd3fc">天气 API</text>
    <text x="82" y="120" font-size="14" font-weight="600" fill="#6b8299">→ 返回实时天气</text>

    <!-- 计算器 -->
    <rect x="28" y="146" width="324" height="66" rx="12" fill="rgba(255,255,255,0.04)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="52" y="186" font-size="26" text-anchor="middle">🧮</text>
    <text x="82" y="178" font-size="19" font-weight="800" fill="#cbd5e1">计算器</text>
    <text x="82" y="200" font-size="14" font-weight="600" fill="#6b7688">→ 精确运算</text>

    <!-- 邮件 -->
    <rect x="28" y="226" width="324" height="66" rx="12" fill="rgba(255,255,255,0.04)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="52" y="266" font-size="24" text-anchor="middle">✉️</text>
    <text x="82" y="258" font-size="19" font-weight="800" fill="#cbd5e1">发邮件</text>
    <text x="82" y="280" font-size="14" font-weight="600" fill="#6b7688">→ 真正发送</text>
  </g>

  <text x="76" y="540" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="url(#fcCap)">Function Calling · 工具调用</text>
  <text x="80" y="586" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#7f8ea0">AI 从「只会说」到「能动手」</text>
  <text x="80" y="622" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#556b7d">模型决定调谁、传什么参数 · 程序执行 · 结果回填</text>
</svg>
