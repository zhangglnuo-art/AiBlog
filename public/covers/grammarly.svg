<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="gmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="gmCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#gmBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#22c55e">// AI 写作</text>

  <!-- 左：待润色的原句 -->
  <g transform="translate(80 128)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="620" height="292" rx="16" fill="#101a16" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="24" y="36" font-size="15" font-weight="700" fill="#5f8071">你写的英文邮件</text>
    <line x1="0" y1="52" x2="620" y2="52" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#c8dcd2">
      <text x="24" y="100">I want you to send me the report</text>
      <text x="24" y="140">before tomorrow. Do it fast.</text>
    </g>
    <!-- 波浪下划线 -->
    <path d="M24 112 q 8 -6 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" stroke="#f87171" stroke-width="3" fill="none"/>
    <path d="M24 152 q 8 -6 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" stroke="#f87171" stroke-width="3" fill="none"/>

    <!-- 语气检测卡片 -->
    <g transform="translate(24 176)">
      <rect x="0" y="0" width="572" height="92" rx="12" fill="rgba(248,113,113,0.09)" stroke="#f87171" stroke-opacity="0.45"/>
      <text x="20" y="34" font-size="17" font-weight="700" fill="#fca5a5">语气检测：Direct · Demanding</text>
      <text x="20" y="66" font-size="16" font-weight="600" fill="#8f9d95">读起来像在下命令，不适合发给客户</text>
    </g>
  </g>

  <!-- 箭头 -->
  <g stroke="#22c55e" stroke-opacity="0.8" stroke-width="4" fill="none">
    <path d="M724 274 H 784"/><path d="M774 264 L 792 274 L 774 284 Z" fill="#22c55e" stroke="none"/>
  </g>
  <text x="756" y="256" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">整句改写</text>

  <!-- 右：改写后 -->
  <g transform="translate(816 128)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="304" height="292" rx="16" fill="#101a16" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="24" y="36" font-size="15" font-weight="700" fill="#5f8071">改写后</text>
    <line x1="0" y1="52" x2="304" y2="52" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="Inter, sans-serif" font-size="19" font-weight="600" fill="#d6ece1">
      <text x="24" y="92">Could you please</text>
      <text x="24" y="122">send the report by</text>
      <text x="24" y="152">tomorrow? Thanks!</text>
    </g>
    <g transform="translate(24 186)">
      <rect x="0" y="0" width="256" height="72" rx="12" fill="rgba(34,197,94,0.10)" stroke="#22c55e" stroke-opacity="0.45"/>
      <text x="18" y="30" font-size="16" font-weight="700" fill="#86efac">✓ Polite · Friendly</text>
      <text x="18" y="56" font-size="15" font-weight="600" fill="#7f9c8b">语气得体，可直接发送</text>
    </g>
  </g>

  <!-- 底部：只管英文的提示 -->
  <text x="80" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#5f8071">只支持英文 · 不做翻译 · 与 DeepL 是搭配而非替代</text>

  <text x="80" y="576" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#gmCap)">Grammarly</text>
  <text x="416" y="576" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#6f8b7c">免费版够用吗 · 各档价格 · 国内订阅</text>
</svg>
