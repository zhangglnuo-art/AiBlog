<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="gkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="gkCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#gkBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#8fa0b8">// AI 助手</text>

  <!-- 对话窗口 -->
  <g transform="translate(80 122)">
    <rect x="0" y="0" width="700" height="386" rx="18" fill="#101319" stroke="#ffffff" stroke-opacity="0.09"/>
    <!-- 顶栏 -->
    <rect x="0" y="0" width="700" height="56" rx="18" fill="#151922"/>
    <rect x="0" y="38" width="700" height="18" fill="#151922"/>
    <!-- Grok 标记 -->
    <g transform="translate(28 16)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#0b0c0f" stroke="#e5e7eb" stroke-opacity="0.6"/>
      <path d="M6 20 L14 8 M13 20 L20 10 M9 14 L18 14" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="66" y="34" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#e5e7eb">Grok</text>
    <rect x="600" y="14" width="78" height="28" rx="8" fill="rgba(100,181,246,0.14)" stroke="#64b5f6" stroke-opacity="0.5"/>
    <text x="639" y="33" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8fd0ff" text-anchor="middle">实时</text>

    <!-- 用户气泡 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="330" y="84" width="342" height="52" rx="14" fill="rgba(255,255,255,0.08)"/>
      <text x="501" y="116" font-size="19" font-weight="600" fill="#d5dbe6" text-anchor="middle">X 上现在在热议什么？</text>

      <!-- Grok 回复气泡 -->
      <rect x="28" y="152" width="470" height="150" rx="14" fill="rgba(100,181,246,0.08)" stroke="#64b5f6" stroke-opacity="0.3"/>
      <rect x="48" y="176" width="150" height="14" rx="4" fill="#5b6577"/>
      <!-- 实时来源标签 -->
      <g>
        <rect x="48" y="200" width="180" height="30" rx="8" fill="rgba(100,181,246,0.12)" stroke="#64b5f6" stroke-opacity="0.4"/>
        <circle cx="66" cy="215" r="5" fill="#64b5f6"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
        <text x="82" y="221" font-size="15" font-weight="600" fill="#8fd0ff">来自 X · 实时热点</text>
      </g>
      <rect x="48" y="246" width="420" height="12" rx="4" fill="#454e5e"/>
      <rect x="48" y="268" width="360" height="12" rx="4" fill="#454e5e"/>
    </g>

    <!-- 输入框 -->
    <rect x="28" y="322" width="644" height="44" rx="12" fill="#0b0e13" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="48" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5b6577">问 Grok 任何事…</text>
    <circle cx="650" cy="344" r="15" fill="#64b5f6"/>
    <path d="M644 344 L656 344 M651 339 L656 344 L651 349" stroke="#0b0c0f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧特性 -->
  <g transform="translate(820 130)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="300" height="86" rx="14" fill="rgba(255,255,255,0.04)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="22" y="38" font-size="20" font-weight="800" fill="#e5e7eb">实时 X 数据</text>
    <text x="22" y="66" font-size="15" font-weight="600" fill="#7d879a">追热点 · 看舆情</text>

    <rect x="0" y="100" width="300" height="86" rx="14" fill="rgba(255,255,255,0.04)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="22" y="138" font-size="20" font-weight="800" fill="#e5e7eb">风格更直接</text>
    <text x="22" y="166" font-size="15" font-weight="600" fill="#7d879a">少客套 · 敢说</text>

    <rect x="0" y="200" width="300" height="86" rx="14" fill="rgba(100,181,246,0.08)" stroke="#64b5f6" stroke-opacity="0.4"/>
    <text x="22" y="238" font-size="20" font-weight="800" fill="#8fd0ff">SuperGrok</text>
    <text x="22" y="266" font-size="15" font-weight="600" fill="#7d879a">约 $30/月 · 最强模型</text>
  </g>

  <text x="80" y="562" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="url(#gkCap)">Grok</text>
  <text x="256" y="562" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#8fa0b8">补齐四大 AI 助手 · 国内订阅全流程</text>
</svg>
