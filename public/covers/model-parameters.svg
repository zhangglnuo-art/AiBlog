<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="mpBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#07101a"/>
      <stop offset="1" stop-color="#091420"/>
    </linearGradient>
    <linearGradient id="mpCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#mpBg)"/>
  <text x="80" y="88" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#7dd3fc">// AI 原理</text>

  <!-- 左：小模型 7B -->
  <g transform="translate(80 132)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="440" height="300" rx="18" fill="rgba(125,211,252,0.05)" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <text x="28" y="52" font-size="34" font-weight="800" fill="#7dd3fc">7B</text>
    <text x="112" y="52" font-size="22" font-weight="700" fill="#9fb6c9">小模型</text>

    <!-- 稀疏节点网络 -->
    <g stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="1.5">
      <path d="M110 130 L200 108 M200 108 L200 190 M200 190 L110 130 M200 108 L300 150 M200 190 L300 150 M300 150 L340 110"/>
    </g>
    <g fill="#7dd3fc">
      <circle cx="110" cy="130" r="10"/><circle cx="200" cy="108" r="10"/><circle cx="200" cy="190" r="10"/><circle cx="300" cy="150" r="10"/><circle cx="340" cy="110" r="10"/><circle cx="150" cy="205" r="10"/>
    </g>

    <!-- 标签 -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="28" y="238" width="110" height="42" rx="21" fill="rgba(94,234,212,0.10)" stroke="#5eead4" stroke-opacity="0.4"/>
      <text x="83" y="265" fill="#7fe6d6">快</text>
      <rect x="150" y="238" width="110" height="42" rx="21" fill="rgba(94,234,212,0.10)" stroke="#5eead4" stroke-opacity="0.4"/>
      <text x="205" y="265" fill="#7fe6d6">省钱</text>
      <rect x="272" y="238" width="140" height="42" rx="21" fill="rgba(94,234,212,0.10)" stroke="#5eead4" stroke-opacity="0.4"/>
      <text x="342" y="265" fill="#7fe6d6">能本地跑</text>
    </g>
  </g>

  <!-- 右：大模型 70B -->
  <g transform="translate(680 132)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="440" height="300" rx="18" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="28" y="52" font-size="34" font-weight="800" fill="#93c5fd">70B</text>
    <text x="132" y="52" font-size="22" font-weight="700" fill="#9fb6c9">大模型</text>

    <!-- 密集节点网络 -->
    <g stroke="#60a5fa" stroke-opacity="0.28" stroke-width="1.3">
      <path d="M70 110 L130 92 L190 118 L250 96 L310 120 L370 100
               M70 110 L130 150 L190 118 M130 150 L190 178 L250 150 L310 120
               M190 178 L250 200 L310 176 L370 200 M250 96 L310 120 L370 100
               M130 92 L190 118 M250 150 L310 176 M70 160 L130 150 M310 176 L370 160
               M190 118 L250 150 M130 92 L130 150 M250 96 L250 150 M310 120 L310 176"/>
    </g>
    <g fill="#93c5fd">
      <circle cx="70" cy="110" r="8"/><circle cx="130" cy="92" r="8"/><circle cx="190" cy="118" r="8"/><circle cx="250" cy="96" r="8"/><circle cx="310" cy="120" r="8"/><circle cx="370" cy="100" r="8"/>
      <circle cx="70" cy="160" r="8"/><circle cx="130" cy="150" r="8"/><circle cx="190" cy="178" r="8"/><circle cx="250" cy="150" r="8"/><circle cx="310" cy="176" r="8"/><circle cx="370" cy="160" r="8"/>
      <circle cx="250" cy="200" r="8"/><circle cx="370" cy="200" r="8"/><circle cx="130" cy="200" r="8"/>
    </g>

    <!-- 标签 -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="28" y="238" width="100" height="42" rx="21" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-opacity="0.4"/>
      <text x="78" y="265" fill="#a9c7f5">更强</text>
      <rect x="140" y="238" width="100" height="42" rx="21" fill="rgba(251,146,60,0.10)" stroke="#fb923c" stroke-opacity="0.4"/>
      <text x="190" y="265" fill="#fdba74">慢</text>
      <rect x="252" y="238" width="160" height="42" rx="21" fill="rgba(251,146,60,0.10)" stroke="#fb923c" stroke-opacity="0.4"/>
      <text x="332" y="265" fill="#fdba74">贵 · 吃显存</text>
    </g>
  </g>

  <!-- 中间对比标记 -->
  <g transform="translate(600 268)">
    <circle cx="0" cy="0" r="34" fill="#0c1a26" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>
    <text x="0" y="10" font-family="Inter, sans-serif" font-size="30" font-weight="800" fill="#7dd3fc" text-anchor="middle">vs</text>
  </g>

  <text x="76" y="540" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="url(#mpCap)">参数量</text>
  <text x="316" y="540" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#7f93a6">7B、70B 到底是什么意思</text>
  <text x="80" y="584" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#5f7385">B = 十亿个参数 · 不是越大越好，够用就好</text>
</svg>
