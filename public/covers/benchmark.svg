<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bmBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="bmCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bmBg)"/>
  <text x="80" y="84" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#60a5fa">// AI 原理</text>

  <!-- 左：柱状图榜单 -->
  <g transform="translate(80 140)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="520" height="358" rx="16" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="24" y="38" font-size="18" font-weight="800" fill="#93c5fd">Benchmark 跑分</text>
    <text x="24" y="64" font-size="15" font-weight="600" fill="#5f7794">发布会上那张柱状图</text>

    <!-- 柱子 -->
    <g transform="translate(40 96)">
      <rect x="0" y="24" width="72" height="168" rx="6" fill="#60a5fa" opacity="0.9"/>
      <text x="36" y="14" font-size="17" font-weight="800" fill="#bfdbfe" text-anchor="middle">92.4</text>
      <text x="36" y="216" font-size="14" font-weight="700" fill="#7f97b4" text-anchor="middle">MMLU</text>

      <rect x="108" y="34" width="72" height="158" rx="6" fill="#60a5fa" opacity="0.7"/>
      <text x="144" y="24" font-size="17" font-weight="800" fill="#bfdbfe" text-anchor="middle">91.8</text>
      <text x="144" y="216" font-size="14" font-weight="700" fill="#7f97b4" text-anchor="middle">GSM8K</text>

      <rect x="216" y="46" width="72" height="146" rx="6" fill="#60a5fa" opacity="0.55"/>
      <text x="252" y="36" font-size="17" font-weight="800" fill="#bfdbfe" text-anchor="middle">91.2</text>
      <text x="252" y="216" font-size="14" font-weight="700" fill="#7f97b4" text-anchor="middle">HumanEval</text>

      <rect x="324" y="52" width="72" height="140" rx="6" fill="#60a5fa" opacity="0.42"/>
      <text x="360" y="42" font-size="17" font-weight="800" fill="#bfdbfe" text-anchor="middle">90.9</text>
      <text x="360" y="216" font-size="14" font-weight="700" fill="#7f97b4" text-anchor="middle">GPQA</text>

      <line x1="-8" y1="192" x2="404" y2="192" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <text x="260" y="336" font-size="16" font-weight="700" fill="#8a6f3f" text-anchor="middle">顶尖模型间差距 0.几分 ≈ 噪声</text>
  </g>

  <!-- 右：四个失真原因 -->
  <g transform="translate(640 128)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="0" y="24" font-size="19" font-weight="800" fill="#fbbf24">为什么跑分高 ≠ 好用</text>

    <g font-size="17" font-weight="700">
      <rect x="0" y="44" width="480" height="62" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="20" y="72" fill="#fcd34d">数据污染</text>
      <text x="140" y="72" font-size="15" font-weight="600" fill="#8f8058">考题混进了训练数据 = 背答案</text>

      <rect x="0" y="118" width="480" height="62" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="20" y="146" fill="#fcd34d">应试优化</text>
      <text x="140" y="146" font-size="15" font-weight="600" fill="#8f8058">指标一旦成为目标就会被针对</text>

      <rect x="0" y="192" width="480" height="62" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="20" y="220" fill="#fcd34d">场景错配</text>
      <text x="140" y="220" font-size="15" font-weight="600" fill="#8f8058">你的活儿大多没有标准答案</text>

      <rect x="0" y="266" width="480" height="62" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="20" y="294" fill="#fcd34d">分数饱和</text>
      <text x="140" y="294" font-size="15" font-weight="600" fill="#8f8058">都刷到 90+ 就没了区分度</text>
    </g>
  </g>

  <text x="80" y="556" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#bmCap)">大模型跑分</text>
  <text x="384" y="556" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#7c7768">Benchmark 榜单该怎么看</text>
  <text x="80" y="598" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#5f5c52">跑分衡量的是模型会做题，不是模型懂你</text>
</svg>
