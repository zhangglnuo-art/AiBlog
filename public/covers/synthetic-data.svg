<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0a1014"/>
      <stop offset="1" stop-color="#120e12"/>
    </linearGradient>
    <linearGradient id="sdCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sdBg)"/>
  <text x="80" y="84" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#34d399">// AI 原理</text>

  <!-- 上：自我循环 -->
  <g transform="translate(80 122)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="480" height="196" rx="16" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="24" y="36" font-size="18" font-weight="800" fill="#6ee7b7">模型造数据，再拿去训模型</text>

    <g transform="translate(24 58)">
      <rect x="0" y="18" width="118" height="60" rx="12" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="59" y="45" font-size="16" font-weight="700" fill="#a7f3d0" text-anchor="middle">强模型</text>
      <text x="59" y="66" font-size="13" font-weight="600" fill="#5f9e86" text-anchor="middle">出题 + 给答案</text>

      <path d="M130 48 H 186" stroke="#34d399" stroke-width="3.5" fill="none"/>
      <path d="M178 41 L 192 48 L 178 55 Z" fill="#34d399"/>

      <rect x="200" y="18" width="118" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="259" y="45" font-size="16" font-weight="700" fill="#cbd5e1" text-anchor="middle">合成数据</text>
      <text x="259" y="66" font-size="13" font-weight="600" fill="#7d8b9c" text-anchor="middle">生成十条留一条</text>

      <path d="M330 48 H 386" stroke="#34d399" stroke-width="3.5" fill="none"/>
      <path d="M378 41 L 392 48 L 378 55 Z" fill="#34d399"/>

      <rect x="400" y="18" width="32" height="60" rx="12" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="416" y="54" font-size="15" font-weight="700" fill="#a7f3d0" text-anchor="middle">训</text>
    </g>
    <text x="24" y="172" font-size="14" font-weight="600" fill="#5f8a78">真实数据见底后，这是主要的补充来源</text>
  </g>

  <!-- 右上：可验证才好用 -->
  <g transform="translate(608 122)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="512" height="196" rx="16" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="24" y="36" font-size="18" font-weight="800" fill="#93c5fd">分水岭：能不能自动验证</text>

    <g font-size="15" font-weight="700">
      <rect x="24" y="56" width="216" height="118" rx="12" fill="rgba(74,222,128,0.09)" stroke="#4ade80" stroke-opacity="0.4"/>
      <text x="132" y="84" fill="#86efac" text-anchor="middle">数学 · 代码 · 逻辑</text>
      <text x="132" y="112" font-size="13" font-weight="600" fill="#5f9e79" text-anchor="middle">跑测试就知道对错</text>
      <text x="132" y="146" font-size="15" font-weight="800" fill="#4ade80" text-anchor="middle">可近乎无限生产</text>

      <rect x="272" y="56" width="216" height="118" rx="12" fill="rgba(248,113,113,0.08)" stroke="#f87171" stroke-opacity="0.4"/>
      <text x="380" y="84" fill="#fca5a5" text-anchor="middle">文案 · 判断 · 审美</text>
      <text x="380" y="112" font-size="13" font-weight="600" fill="#a86a6a" text-anchor="middle">没有标准答案</text>
      <text x="380" y="146" font-size="15" font-weight="800" fill="#f87171" text-anchor="middle">收益有限</text>
    </g>
  </g>

  <!-- 下：模型崩溃 -->
  <g transform="translate(80 348)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="1040" height="132" rx="16" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-opacity="0.35"/>
    <text x="28" y="38" font-size="18" font-weight="800" fill="#fca5a5">风险：模型崩溃 —— 复印件的复印件</text>

    <g transform="translate(28 56)">
      <rect x="0" y="0" width="150" height="52" rx="10" fill="#cbd5e1" opacity="0.9"/>
      <text x="75" y="32" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">原始真实数据</text>

      <text x="172" y="33" font-size="20" font-weight="800" fill="#64748b">→</text>

      <rect x="198" y="0" width="150" height="52" rx="10" fill="#94a3b8" opacity="0.75"/>
      <text x="273" y="32" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">第 1 轮合成</text>

      <text x="370" y="33" font-size="20" font-weight="800" fill="#64748b">→</text>

      <rect x="396" y="0" width="150" height="52" rx="10" fill="#64748b" opacity="0.6"/>
      <text x="471" y="32" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">第 3 轮</text>

      <text x="568" y="33" font-size="20" font-weight="800" fill="#64748b">→</text>

      <rect x="594" y="0" width="150" height="52" rx="10" fill="#475569" opacity="0.45"/>
      <text x="669" y="32" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">第 10 轮</text>

      <text x="776" y="24" font-size="15" font-weight="700" fill="#f87171">长尾消失</text>
      <text x="776" y="46" font-size="15" font-weight="700" fill="#f87171">偏差被放大</text>
    </g>
  </g>

  <text x="80" y="566" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#sdCap)">合成数据</text>
  <text x="368" y="566" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#77827c">AI 用自己造的数据训练自己</text>
  <text x="80" y="606" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#5d685f">它是放大器，不是永动机</text>
</svg>
