<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="rlBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0a1012"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="rlCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rlBg)"/>
  <text x="80" y="80" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" letter-spacing="6" font-weight="600" fill="#34d399">// AI 原理</text>

  <!-- 顶部：野孩子 → 好助手 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(80 108)">
      <rect x="0" y="0" width="230" height="52" rx="14" fill="rgba(148,163,184,0.08)" stroke="#94a3b8" stroke-opacity="0.4"/>
      <text x="115" y="33" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="middle">只会接龙的「野孩子」</text>
    </g>
    <g stroke="#60a5fa" stroke-opacity="0.6" stroke-width="3" fill="none">
      <path d="M690 134 H 860"/><path d="M850 126 L 866 134 L 850 142 Z" fill="#60a5fa" stroke="none"/>
    </g>
    <text x="775" y="124" font-size="15" font-weight="700" fill="#5f9ee0" text-anchor="middle">RLHF 调教</text>
    <g transform="translate(890 108)">
      <rect x="0" y="0" width="230" height="52" rx="14" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="115" y="33" font-size="18" font-weight="800" fill="#6ee7b7" text-anchor="middle">懂事的「好助手」</text>
    </g>
  </g>

  <!-- 三步卡片 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Step 1: 人类示范 -->
    <g transform="translate(80 200)">
      <rect x="0" y="0" width="320" height="250" rx="18" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="44" cy="46" r="20" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="44" y="53" font-size="22" text-anchor="middle">👤</text>
      <text x="80" y="42" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#93c5fd">1</text>
      <text x="106" y="42" font-size="20" font-weight="800" fill="#e5e7eb">人类示范</text>
      <text x="80" y="66" font-size="14" font-weight="600" fill="#7c8794">教它该怎么答</text>
      <!-- 范例答案 -->
      <g>
        <rect x="30" y="96" width="260" height="44" rx="10" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-opacity="0.3"/>
        <text x="46" y="123" font-size="15" font-weight="600" fill="#a9c7f5">✓ 理想答案范例</text>
        <rect x="30" y="150" width="260" height="16" rx="4" fill="#3a4657"/>
        <rect x="30" y="176" width="220" height="16" rx="4" fill="#3a4657"/>
        <rect x="30" y="202" width="240" height="16" rx="4" fill="#3a4657"/>
      </g>
    </g>

    <!-- 箭头 -->
    <g stroke="#34d399" stroke-opacity="0.55" stroke-width="3" fill="none">
      <path d="M410 325 H 436"/><path d="M428 317 L 442 325 L 428 333 Z" fill="#34d399" stroke="none"/>
    </g>

    <!-- Step 2: 打分员 -->
    <g transform="translate(448 200)">
      <rect x="0" y="0" width="320" height="250" rx="18" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="30" y="42" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#fbbf24">2</text>
      <text x="56" y="42" font-size="20" font-weight="800" fill="#e5e7eb">训练打分员</text>
      <text x="30" y="66" font-size="14" font-weight="600" fill="#7c8794">给答案排序打分（奖励模型）</text>
      <!-- 三个答案 + 打分 -->
      <g>
        <rect x="30" y="88" width="200" height="38" rx="9" fill="#232a24"/>
        <rect x="46" y="100" width="130" height="14" rx="4" fill="#4b5560"/>
        <text x="270" y="113" font-size="20" text-anchor="middle">👍</text>
        <text x="252" y="82" font-size="13" font-weight="700" fill="#86efac">高分</text>

        <rect x="30" y="136" width="200" height="38" rx="9" fill="#232a24"/>
        <rect x="46" y="148" width="160" height="14" rx="4" fill="#4b5560"/>
        <text x="270" y="161" font-size="19" text-anchor="middle">😐</text>

        <rect x="30" y="184" width="200" height="38" rx="9" fill="#232a24"/>
        <rect x="46" y="196" width="100" height="14" rx="4" fill="#4b5560"/>
        <text x="270" y="209" font-size="20" text-anchor="middle">👎</text>
        <text x="252" y="178" font-size="13" font-weight="700" fill="#f0a0a0">低分</text>
      </g>
    </g>

    <!-- 箭头 -->
    <g stroke="#34d399" stroke-opacity="0.55" stroke-width="3" fill="none">
      <path d="M778 325 H 804"/><path d="M796 317 L 810 325 L 796 333 Z" fill="#34d399" stroke="none"/>
    </g>

    <!-- Step 3: 追高分 -->
    <g transform="translate(816 200)">
      <rect x="0" y="0" width="320" height="250" rx="18" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="30" y="42" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#6ee7b7">3</text>
      <text x="56" y="42" font-size="20" font-weight="800" fill="#e5e7eb">AI 追高分</text>
      <text x="30" y="66" font-size="14" font-weight="600" fill="#7c8794">朝高分方向反复进化</text>
      <!-- 奖杯 + 上升曲线 + 回环 -->
      <g transform="translate(0 20)">
        <text x="250" y="120" font-size="52" text-anchor="middle">🏆</text>
        <path d="M40 190 C 100 186, 150 150, 250 96" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M238 100 L 254 92 L 250 110 Z" fill="#34d399"/>
        <circle cx="40" cy="190" r="8" fill="#34d399"/>
        <!-- 强化学习回环 -->
        <path d="M150 210 q 60 40 120 0" stroke="#6ee7b7" stroke-opacity="0.7" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
        <text x="210" y="240" font-size="14" font-weight="700" fill="#5fb394" text-anchor="middle">强化学习循环</text>
      </g>
    </g>
  </g>

  <text x="76" y="560" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="url(#rlCap)">RLHF · 对齐</text>
  <text x="392" y="560" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#7f927f">AI 是怎么被「调教」得懂事的</text>
  <text x="80" y="600" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#586b5a">人类示范 → 训练打分员 → 让 AI 追着高分进化</text>
</svg>
